<!DOCTYPE html>
<html lang="en" class="pcode-app-bento-root dark">
<head>
  <script src="js/pcode-theme-init.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-Code - Admin Login</title>
  <!-- Local CSS Files (No CDN) -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- Local Fonts (No CDN) -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <!-- Local JavaScript Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer crossorigin="anonymous"></script>
  <script src="js/libs/typed.min.js" defer></script>
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background: white; 
      color: inherit !important; 
    }
    .input-medical { 
      width: 100%; 
      padding: 0.75rem; 
      border: 1px solid #ddd !important; 
      border-radius: 0.5rem; 
      font-size: 1rem; 
      transition: border-color 0.3s ease; 
      font-family: inherit; 
      background-color: white !important; 
      color: #333 !important; 
    }
    .input-medical::placeholder { 
      color: #999 !important; 
    }
    .input-medical:focus { 
      outline: none; 
      border-color: #6B46C1 !important; 
      box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1); 
      background-color: white !important; 
      color: #333 !important; 
    }
    input, textarea, select { 
      background-color: white !important; 
      color: #333 !important; 
    }
    input::placeholder { 
      color: #999 !important; 
    }
    .auth-page-container { 
      min-height: 100vh; 
      display: flex; 
      background: white; 
      flex-direction: row; 
    }
    .auth-page-left { 
      position: fixed; 
      left: 0; 
      top: 0; 
      width: 50%; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      color: white; 
      padding: 2rem; 
      background: linear-gradient(135deg, rgba(88, 28, 135, 0.9) 0%, rgba(109, 40, 217, 0.8) 100%), url('resources/hero-medical.jpg') center/cover no-repeat; 
      background-attachment: fixed; 
      overflow: hidden; 
    }
    @media (max-width: 768px) {
      /* Avoid iOS Safari jank with fixed backgrounds */
      .auth-page-left { background-attachment: scroll !important; }
    }
    .auth-page-right { 
      margin-left: 50%; 
      width: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: white; 
      padding: 2rem; 
      min-height: 100vh; 
      overflow-y: auto; 
    }
    .auth-form-container { 
      width: 100%; 
      max-width: 420px; 
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.5rem;
    }
    .auth-header p {
      font-size: 0.875rem;
      color: #666;
    }
    .btn-primary { 
      width: 100%; 
      padding: 0.75rem; 
      background-color: #6B46C1; 
      color: white; 
      border: none; 
      border-radius: 0.5rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: background-color 0.3s ease; 
      font-size: 1rem; 
    }
    .btn-primary:hover { 
      background-color: #553399; 
    }
    .btn-primary:disabled { 
      background-color: #ccc; 
      cursor: not-allowed; 
    }
    .btn-secondary {
      width: 100%;
      padding: 0.75rem;
      background-color: #e5e7eb;
      color: #333;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-size: 1rem;
      margin-top: 1rem;
    }
    .btn-secondary:hover {
      background-color: #d1d5db;
    }
    .form-group { 
      margin-bottom: 1.5rem; 
    }
    .form-label { 
      display: block; 
      font-size: 0.875rem; 
      font-weight: 600; 
      color: #333; 
      margin-bottom: 0.5rem; 
    }
    .form-error { 
      color: #dc2626; 
      font-size: 0.875rem; 
      margin-top: 0.5rem; 
      display: none; 
    }
    .form-error.show { 
      display: block; 
    }
    .form-footer { 
      text-align: center; 
      margin-top: 1.5rem; 
      font-size: 0.875rem; 
      color: #666; 
    }
    .form-footer a { 
      color: #6B46C1; 
      text-decoration: none; 
      font-weight: 600; 
    }
    .form-footer a:hover { 
      text-decoration: underline; 
    }
    .password-field-wrapper { 
      position: relative; 
      display: flex; 
      align-items: center; 
    }
    .password-field-wrapper input { 
      width: 100%; 
      padding-right: 2.75rem; 
    }
    .toggle-password { 
      position: absolute; 
      right: 0.5rem; 
      background: none; 
      border: none; 
      cursor: pointer; 
      color: #666; 
      padding: 0.5rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 2.5rem; 
      height: 2.5rem; 
      border-radius: 0.375rem; 
      transition: all 0.2s ease; 
    }
    .toggle-password:hover { 
      color: #6B46C1; 
      background-color: rgba(107, 70, 193, 0.15); 
      transform: scale(1.1);
    }
    .toggle-password:active {
      transform: scale(0.95);
    }
    .toggle-password svg {
      width: 1.5rem;
      height: 1.5rem;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.2s ease;
    }
    .password-icon-visible.hidden {
      display: none !important;
    }
    .left-content { 
      transition: opacity 0.3s ease; 
      width: 100%; 
      min-height: 500px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }
    .left-content .text-center { 
      width: 100%; 
      text-align: center;
      background: transparent !important;
      padding: 0;
    }
    .left-content h2 {
      color: white !important;
    }
    .left-content p {
      color: white !important;
    }
    .left-content img {
      background: transparent !important;
      background-color: transparent !important;
    }
    input[type="checkbox"] {
      accent-color: #6B46C1;
      cursor: pointer;
    }
    .admin-badge {
      display: inline-block;
      background: #6B46C1;
      color: white;
      padding: 0.375rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    @media (max-width: 1024px) { 
      .auth-page-left { display: none; } 
      .auth-page-right { margin-left: 0; width: 100%; } 
      .auth-page-container { flex-direction: column; } 
    }
    @media (max-width: 768px) { 
      .auth-form-container { max-width: 100%; } 
      .auth-page-right { padding: 1rem; } 
    }
    @media (max-width: 640px) {
      .auth-form-container { max-width: 100%; padding: 0; }
      .auth-tabs { display: flex; margin-bottom: 1rem; gap: 0; }
      .auth-tab { flex: 1; padding: 0.75rem; font-size: 0.875rem; min-height: 44px; }
      .form-group { margin-bottom: 1rem; }
      .form-label { font-size: 0.8125rem; margin-bottom: 0.375rem; }
      .input-medical { padding: 0.625rem; font-size: 1rem; }
      .btn-primary { padding: 0.625rem; font-size: 0.95rem; min-height: 48px; }
    }
  </style>
  <link rel="stylesheet" href="css/pcode-app-bento-dark.css?v=20260724-cardglow">
<link rel="stylesheet" href="css/pcode-theme.css?v=20260726-nolift">
<link rel="stylesheet" href="css/pcode-glass-buttons.css?v=20260724-logoutred">
<link rel="stylesheet" href="css/pcode-design-system.css?v=20260726-nolift">
<link rel="stylesheet" href="css/pcode-card-hover-reset.css?v=20260726-nolift">
<link rel="stylesheet" href="css/pcode-responsive-global.css?v=20260723-ipadnav">
  <link rel="stylesheet" href="css/pcode-mobile-compact.css?v=20260723-mobtn">
</head>
<body class="pcode-app-bento min-h-screen h-auto flex flex-col text-zinc-50 antialiased">
  <div class="auth-page-container">
    <!-- Left Section -->
    <div class="auth-page-left">
      <div class="text-center">
        <img src="resources/PCODE_LOGO.png" alt="P-Code Logo" class="mx-auto mb-6 w-40 h-40 sm:w-56 sm:h-56 md:w-64 md:h-64 object-contain">
        <h2 class="text-3xl font-bold mb-4 text-white">P-Code: Admin Portal</h2>
        <p class="text-lg opacity-90">Secure administrative access to manage the system and users</p>
      </div>
    </div>

    <!-- Right Section -->
    <div class="auth-page-right">
      <div class="auth-form-container">
        <div class="auth-header">
          <div class="admin-badge">ADMINISTRATOR ACCESS</div>
          <h1>Admin Login</h1>
          <p>Enter your administrator credentials to access the admin dashboard</p>
        </div>

        <!-- Admin Login Form -->
        <form id="admin-login-form" class="space-y-6">
          <div class="form-group">
            <label class="form-label">Administrator Email</label>
            <input type="email" id="admin-email" class="input-medical" placeholder="admin@hospital.com" required>
            <div id="admin-email-error" class="form-error"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="password-field-wrapper">
              <input type="password" id="admin-password" class="input-medical" placeholder="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('admin-password')" title="Toggle password visibility">
                <svg class="password-icon-hidden" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                  <ellipse cx="12" cy="12" rx="10" ry="6" fill="none" stroke="#666" stroke-width="2"/>
                  <circle cx="12" cy="12" r="2.5" fill="#666"/>
                </svg>
                <svg class="password-icon-visible hidden" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                  <ellipse cx="12" cy="12" rx="10" ry="6" fill="none" stroke="#666" stroke-width="2"/>
                  <circle cx="12" cy="12" r="2.5" fill="#666"/>
                  <line x1="2" y1="22" x2="22" y2="2" stroke="#666" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
            <div id="admin-password-error" class="form-error"></div>
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center">
              <input type="checkbox" id="admin-remember-me" class="rounded border-gray-300 text-purple-600">
              <span class="ml-2 text-gray-600">Remember me</span>
            </label>
          </div>
          <div id="admin-login-general-error" class="form-error"></div>
          <button type="submit" id="admin-login-btn" class="btn-primary">Sign in to Admin Dashboard</button>
          <input type="hidden" id="login-mode" value="admin">
        </form>

        <div class="form-footer">
          Not an administrator? <a href="login-new.html">Log in here</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Module -->
  <script src="js/pcode-api.js?v=20260730-apiscan"></script>
  <script src="js/auth.js"></script>

  <script>
    // Toggle password visibility
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (!field) return;
      
      let button = event.target.closest('.toggle-password');
      if (!button) {
        button = document.querySelector(`button[onclick="togglePasswordVisibility('${fieldId}')"]`);
      }
      
      if (field && button) {
        field.type = field.type === 'password' ? 'text' : 'password';
        
        const hiddenIcon = button.querySelector('.password-icon-hidden');
        const visibleIcon = button.querySelector('.password-icon-visible');
        
        if (hiddenIcon && visibleIcon) {
          const isPassword = field.type === 'password';
          if (isPassword) {
            hiddenIcon.classList.remove('hidden');
            visibleIcon.classList.add('hidden');
          } else {
            hiddenIcon.classList.add('hidden');
            visibleIcon.classList.remove('hidden');
          }
        }
      }
    }

    // Initialize form handlers
    function initializeFormHandlers() {
      console.log('Initializing admin login form handlers...');

      // Admin login form handler
      const adminLoginForm = document.getElementById('admin-login-form');
      if (adminLoginForm) {
        adminLoginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          console.log('Admin login form submitted');
          if (typeof auth !== 'undefined' && typeof auth.handleAdminLoginAuth === 'function') {
            auth.handleAdminLoginAuth(e);
          } else {
            console.error('Auth not ready');
            alert('Authentication system not ready. Please refresh the page.');
          }
        });
      }

      console.log('Admin form handlers initialized');
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        console.log('Admin login page DOMContentLoaded fired');
        initializeFormHandlers();

        // Load saved credentials if available
        setTimeout(() => {
          if (typeof auth !== 'undefined' && typeof auth.loadSavedCredentials === 'function') {
            auth.loadSavedCredentials();
          }
        }, 100);

        // Check if already authenticated (with delay to ensure auth module is ready)
        setTimeout(() => {
          if (typeof auth !== 'undefined' && typeof auth.isAuthenticated === 'function') {
            if (auth.isAuthenticated()) {
              console.log('User already authenticated, redirecting...');
              // Redirect based on user role
              let redirectUrl = 'index.html';
              if (auth.currentUser && (auth.currentUser.role === 'Administrator' || auth.currentUser.role === 'admin')) {
                redirectUrl = 'admin-dashboard.html';
              }
              window.location.href = redirectUrl;
            }
          }
        }, 200);
      });
    } else {
      // DOM already loaded
      console.log('Admin login page DOM already loaded, initializing immediately');
      initializeFormHandlers();

      // Load saved credentials if available
      setTimeout(() => {
        if (typeof auth !== 'undefined' && typeof auth.loadSavedCredentials === 'function') {
          auth.loadSavedCredentials();
        }
      }, 100);

      setTimeout(() => {
        if (typeof auth !== 'undefined' && typeof auth.isAuthenticated === 'function') {
          if (auth.isAuthenticated()) {
            console.log('User already authenticated, redirecting...');
            // Redirect based on user role
            let redirectUrl = 'index.html';
            if (auth.currentUser && (auth.currentUser.role === 'Administrator' || auth.currentUser.role === 'admin')) {
              redirectUrl = 'admin-dashboard.html';
            }
            window.location.href = redirectUrl;
          }
        }
      }, 200);
    }
  </script>
</body>
</html>
